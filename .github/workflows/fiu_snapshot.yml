name: fiu-snapshot
# Weekly snapshot of the FIU Sargassum Watch export. Raw reports are NOT published (public repo;
# FIU data courtesy rule): only a summary row (counts, newest/oldest, content hash) is committed.
on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-commit
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev
      - run: uv run python -m pipeline.ingest.fiu --manifest archive/fiu/manifest.csv
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/fiu/manifest.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "archive: FIU snapshot summary $(date -u +%F)"
          git pull --rebase
          git push
